<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#86efac;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="0"/>
  <rect width="800" height="500" fill="url(#overlay)"/>
  <!-- bed shape -->
  <rect x="200" y="240" width="400" height="80" rx="10" fill="rgba(255,255,255,0.25)"/>
  <rect x="210" y="220" width="120" height="40" rx="8" fill="rgba(255,255,255,0.35)"/>
  <rect x="470" y="220" width="120" height="40" rx="8" fill="rgba(255,255,255,0.35)"/>
  <rect x="200" y="320" width="8" height="30" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="592" y="320" width="8" height="30" rx="3" fill="rgba(255,255,255,0.4)"/>
  <!-- pillow -->
  <ellipse cx="270" cy="240" rx="40" ry="15" fill="rgba(255,255,255,0.45)"/>
  <ellipse cx="530" cy="240" rx="40" ry="15" fill="rgba(255,255,255,0.45)"/>
  <!-- text -->
  <text x="400" y="420" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="rgba(255,255,255,0.9)" text-anchor="middle">Garden View Bedspace</text>
  <text x="400" y="455" font-family="Arial,sans-serif" font-size="16" fill="rgba(255,255,255,0.7)" text-anchor="middle">Alondes Dorm</text>
</svg>
