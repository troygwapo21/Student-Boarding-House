services:
  - type: web
    name: dashboard-analytics
    runtime: python
    plan: free
    region: singapore
    rootDir: app/analytics
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard_analytics:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DASHBOARD_ANALYTICS_API_TOKEN
        generateValue: true
