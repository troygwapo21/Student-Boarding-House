{% extends 'shared/base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center py-5">
            <div class="display-1 text-danger">{{ error_code }}</div>
            <h2 class="mt-3">{{ error_title }}</h2>
            <p class="text-muted mb-4">{{ error_message }}</p>
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary"><i class="fas fa-home me-1"></i>Go to Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block sidebar %}{% endblock %}
{% block navbar %}{% endblock %}
